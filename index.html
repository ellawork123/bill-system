<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公司帳單管理系統 | Company Bill Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; transition: background-color 0.3s, color 0.3s; }
        .dark { background-color: #0f172a; color: #f8fafc; }
        .dark .bg-white { background-color: #1e293b; color: #f8fafc; }
        .dark .bg-gray-50 { background-color: #0f172a; }
        .dark .border-gray-100, .dark .border-gray-200 { border-color: #334155; }
        .dark .text-gray-500 { color: #94a3b8; }
        .dark .text-gray-900 { color: #f8fafc; }
        .dark .hover\:bg-gray-50:hover { background-color: #334155; }
        .tab-active { border-bottom: 2px solid #3b82f6; color: #3b82f6; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        [v-cloak] { display: none; }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        darkCard: '#1e293b',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
    <!-- Login Modal -->
    <div id="login-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-2xl w-full max-w-md mx-4 p-8">
            <div class="flex items-center justify-center mb-6">
                <i data-lucide="lock" class="w-8 h-8 text-blue-600 mr-3"></i>
                <h2 class="text-2xl font-bold">System Login</h2>
            </div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2">Password</label>
                    <input type="password" id="login-password" required class="w-full border border-gray-300 dark:border-slate-700 dark:bg-slate-800 rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition-colors">Login</button>
            </form>
            <p class="text-xs text-gray-500 text-center mt-4">Default password: <code class="bg-gray-100 dark:bg-slate-700 px-2 py-1 rounded">admin</code></p>
        </div>
    </div>

    <div id="app" class="max-w-[1400px] mx-auto px-4 py-8 hidden">
        <!-- Header -->
        <header class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
            <div>
                <h1 class="text-2xl font-bold flex items-center gap-2">
                    <i data-lucide="shield-check" class="text-blue-600"></i>
                    <span data-t="title">公司帳單管理系統</span>
                </h1>
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <button id="toggle-lang" class="p-2 rounded-lg border border-gray-200 dark:border-slate-700 hover:bg-gray-100 dark:hover:bg-slate-800 transition-colors">
                    <span id="lang-text">EN</span>
                </button>
                <button id="toggle-dark" class="p-2 rounded-lg border border-gray-200 dark:border-slate-700 hover:bg-gray-100 dark:hover:bg-slate-800 transition-colors">
                    <i data-lucide="moon" id="dark-icon" class="w-5 h-5"></i>
                </button>
                <button id="settings-btn" class="p-2 rounded-lg border border-gray-200 dark:border-slate-700 hover:bg-gray-100 dark:hover:bg-slate-800 transition-colors" title="Settings">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                </button>
                <button id="add-bill-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition-colors shadow-lg shadow-blue-500/20">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i>
                    <span data-t="addBill">新增帳單</span>
                </button>
                <button id="export-btn" class="bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 hover:bg-gray-50 dark:hover:bg-slate-700 px-4 py-2 rounded-lg flex items-center gap-2 transition-colors shadow-sm">
                    <i data-lucide="download" class="w-4 h-4"></i>
                    <span data-t="export">匯出</span>
                </button>
            </div>
        </header>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center gap-4">
                <div class="p-3 bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 rounded-lg">
                    <i data-lucide="wallet" class="w-6 h-6"></i>
                </div>
                <div>
                    <p class="text-xs text-gray-500 font-medium uppercase tracking-wider" data-t="statUnpaid">未付總額</p>
                    <h3 id="stat-total-unpaid" class="text-xl font-bold">$0.00</h3>
                </div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center gap-4">
                <div class="p-3 bg-yellow-50 dark:bg-yellow-900/30 text-yellow-600 dark:text-yellow-400 rounded-lg">
                    <i data-lucide="clock" class="w-6 h-6"></i>
                </div>
                <div>
                    <p class="text-xs text-gray-500 font-medium uppercase tracking-wider" data-t="stat30">30天內到期</p>
                    <h3 id="stat-due-30" class="text-xl font-bold">0</h3>
                </div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center gap-4">
                <div class="p-3 bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 rounded-lg">
                    <i data-lucide="alert-circle" class="w-6 h-6"></i>
                </div>
                <div>
                    <p class="text-xs text-gray-500 font-medium uppercase tracking-wider" data-t="statOverdue">已逾期</p>
                    <h3 id="stat-overdue" class="text-xl font-bold">0</h3>
                </div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center gap-4">
                <div class="p-3 bg-green-50 dark:bg-green-900/30 text-green-600 dark:text-green-400 rounded-lg">
                    <i data-lucide="check-circle" class="w-6 h-6"></i>
                </div>
                <div>
                    <p class="text-xs text-gray-500 font-medium uppercase tracking-wider" data-t="statPaid">本月已付</p>
                    <h3 id="stat-paid-month" class="text-xl font-bold">$0.00</h3>
                </div>
            </div>
        </div>

        <!-- Navigation -->
        <nav class="flex border-b border-gray-200 dark:border-slate-700 mb-8 overflow-x-auto no-scrollbar">
            <button data-tab="dashboard" class="nav-tab px-6 py-3 font-medium text-sm whitespace-nowrap tab-active" data-t="tabDashboard">儀表板</button>
            <button data-tab="bills" class="nav-tab px-6 py-3 font-medium text-sm whitespace-nowrap text-gray-500 hover:text-gray-700 dark:hover:text-slate-300" data-t="tabBills">所有帳單</button>
            <button data-tab="templates" class="nav-tab px-6 py-3 font-medium text-sm whitespace-nowrap text-gray-500 hover:text-gray-700 dark:hover:text-slate-300" data-t="tabTemplates">範本管理</button>
            <button data-tab="history" class="nav-tab px-6 py-3 font-medium text-sm whitespace-nowrap text-gray-500 hover:text-gray-700 dark:hover:text-slate-300" data-t="tabHistory">歷史紀錄</button>
        </nav>

        <!-- Main Content -->
        <main>
            <!-- Dashboard Tab -->
            <section id="tab-dashboard" class="tab-content">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 dark:border-slate-700 overflow-hidden">
                        <div class="px-6 py-4 border-b border-gray-100 dark:border-slate-700 flex justify-between items-center bg-red-50/50 dark:bg-red-900/10">
                            <h4 class="font-bold text-red-700 dark:text-red-400" data-t="statOverdue">已逾期</h4>
                            <span class="text-[10px] bg-red-100 dark:bg-red-900/40 text-red-700 dark:text-red-400 px-2 py-1 rounded-full font-bold uppercase tracking-wider" data-t="urgent">緊急</span>
                        </div>
                        <div id="overdue-list" class="divide-y divide-gray-50 dark:divide-slate-700 max-h-[450px] overflow-y-auto">
                            <div class="p-12 text-center text-gray-400 italic" data-t="noBills">暫無帳單</div>
                        </div>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 dark:border-slate-700 overflow-hidden">
                        <div class="px-6 py-4 border-b border-gray-100 dark:border-slate-700 flex justify-between items-center bg-yellow-50/50 dark:bg-yellow-900/10">
                            <h4 class="font-bold text-yellow-700 dark:text-yellow-400" data-t="next30">未來 30 天</h4>
                            <span class="text-[10px] bg-yellow-100 dark:bg-yellow-900/40 text-yellow-700 dark:text-yellow-400 px-2 py-1 rounded-full font-bold uppercase tracking-wider" data-t="upcoming">即將到期</span>
                        </div>
                        <div id="upcoming-30-list" class="divide-y divide-gray-50 dark:divide-slate-700 max-h-[450px] overflow-y-auto">
                            <div class="p-12 text-center text-gray-400 italic" data-t="noBills">暫無帳單</div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Bills Tab -->
            <section id="tab-bills" class="tab-content hidden">
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 dark:border-slate-700 overflow-hidden">
                    <div class="p-4 border-b border-gray-100 dark:border-slate-700 flex flex-col md:flex-row gap-4 items-center justify-between bg-gray-50/50 dark:bg-slate-800/50">
                        <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                            <select id="filter-year" class="text-sm border border-gray-200 dark:border-slate-700 dark:bg-slate-800 rounded-md px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="all" data-t="allYears">所有年份</option>
                            </select>
                            <select id="filter-month" class="text-sm border border-gray-200 dark:border-slate-700 dark:bg-slate-800 rounded-md px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="all" data-t="allMonths">所有月份</option>
                                <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
                                <option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option>
                                <option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option>
                            </select>
                            <select id="filter-category" class="text-sm border border-gray-200 dark:border-slate-700 dark:bg-slate-800 rounded-md px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="all" data-t="allCategories">所有類別</option>
                            </select>
                            <select id="filter-status" class="text-sm border border-gray-200 dark:border-slate-700 dark:bg-slate-800 rounded-md px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="all" data-t="allStatus">所有狀態</option>
                                <option value="Unpaid" data-t="unpaid">未付</option>
                                <option value="Paid" data-t="paid">已付</option>
                                <option value="Overdue" data-t="overdue">逾期</option>
                            </select>
                            <button id="manage-cats-btn" class="text-xs bg-gray-100 dark:bg-slate-700 px-3 py-1.5 rounded hover:bg-gray-200 dark:hover:bg-slate-600 transition-colors" data-t="manageCategories">管理類別</button>
                        </div>
                        <div class="relative w-full md:w-64">
                            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <input type="text" id="search-bills" placeholder="搜尋..." class="w-full text-sm border border-gray-200 dark:border-slate-700 dark:bg-slate-800 rounded-md pl-10 pr-4 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-gray-50 dark:bg-slate-800 text-gray-500 dark:text-slate-400 font-medium border-b border-gray-100 dark:border-slate-700">
                                <tr>
                                    <th class="px-6 py-4" data-t="thName">帳單名稱</th>
                                    <th class="px-6 py-4 cursor-pointer hover:text-blue-600" id="sort-amount" data-t="thAmountSort">金額</th>
                                    <th class="px-6 py-4 cursor-pointer hover:text-blue-600" id="sort-date" data-t="thDateSort">到期日</th>
                                    <th class="px-6 py-4 cursor-pointer hover:text-blue-600" id="sort-status" data-t="thStatusSort">狀態</th>
                                    <th class="px-6 py-4 text-right" data-t="thActions">操作</th>
                                </tr>
                            </thead>
                            <tbody id="bills-table-body" class="divide-y divide-gray-50 dark:divide-slate-700">
                                <!-- Dynamic content -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- Templates Tab -->
            <section id="tab-templates" class="tab-content hidden">
                <div class="mb-6 flex justify-between items-center">
                    <h4 class="font-bold text-lg" data-t="vendorTemplates">範本管理</h4>
                    <button id="add-template-btn" class="text-sm bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 px-4 py-2 rounded-lg font-medium hover:bg-blue-100 transition-colors">
                        <span data-t="createTemplate">建立新範本</span>
                    </button>
                </div>
                <div id="templates-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Dynamic content -->
                </div>
            </section>

            <!-- History Tab -->
            <section id="tab-history" class="tab-content hidden">
                <!-- Payment History Section -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 dark:border-slate-700 p-6 mb-8">
                    <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                        <h4 class="font-bold text-lg" data-t="paymentHistory">付款歷史紀錄</h4>
                        <div class="flex flex-wrap gap-2 items-center w-full md:w-auto">
                            <div class="relative flex-1 md:flex-none md:w-64">
                                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                <input type="text" id="search-history" placeholder="搜尋歷史..." class="w-full text-sm border border-gray-200 dark:border-slate-700 dark:bg-slate-800 rounded-md pl-10 pr-4 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <select id="history-year" class="text-sm border border-gray-200 dark:border-slate-700 dark:bg-slate-800 rounded-md px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="all">All Years</option>
                            </select>
                            <select id="history-month" class="text-sm border border-gray-200 dark:border-slate-700 dark:bg-slate-800 rounded-md px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="all">All Months</option>
                                <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
                                <option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option>
                                <option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option>
                            </select>
                        </div>
                    </div>
                    <div id="history-content" class="space-y-4">
                        <!-- Dynamic content -->
                    </div>
                </div>

                <!-- Cheque Book History Section -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 dark:border-slate-700 p-6">
                    <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                        <h4 class="font-bold text-lg" data-t="chequeHistory">支票簿歷史紀錄</h4>
                        <div class="flex flex-wrap gap-2 items-center w-full md:w-auto">
                            <select id="cheque-bank-filter" class="text-sm border border-gray-200 dark:border-slate-700 dark:bg-slate-800 rounded-md px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="all">All Banks</option>
                            </select>
                            <div class="relative flex-1 md:flex-none md:w-64">
                                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                <input type="text" id="search-cheque" placeholder="Search cheques..." class="w-full text-sm border border-gray-200 dark:border-slate-700 dark:bg-slate-800 rounded-md pl-10 pr-4 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-gray-50 dark:bg-slate-800 text-gray-500 dark:text-slate-400 font-medium border-b border-gray-100 dark:border-slate-700">
                                <tr>
                                    <th class="px-6 py-4">Bank</th>
                                    <th class="px-6 py-4">Cheque No</th>
                                    <th class="px-6 py-4">Pay To</th>
                                    <th class="px-6 py-4">Amount</th>
                                    <th class="px-6 py-4">Payment Date</th>
                                    <th class="px-6 py-4">Bill Name</th>
                                </tr>
                            </thead>
                            <tbody id="cheque-table-body" class="divide-y divide-gray-50 dark:divide-slate-700">
                                <!-- Dynamic content -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modals -->
    <div id="bill-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-40 p-4">
        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-2xl w-full max-w-3xl max-h-[90vh] overflow-y-auto">
            <div class="sticky top-0 bg-white dark:bg-slate-800 px-6 py-4 border-b border-gray-100 dark:border-slate-700 flex justify-between items-center">
                <h3 class="text-lg font-bold" data-t="addBill">新增帳單</h3>
                <button class="close-modal text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="p-6">
                <!-- Smart Paste restored -->
                <div class="mb-6 p-4 bg-blue-50 dark:bg-blue-900/20 rounded-lg border border-blue-100 dark:border-blue-900/30">
                    <label class="block text-sm font-bold text-blue-700 dark:text-blue-400 mb-2" data-t="smartPaste">智能提取 (Smart Paste)</label>
                    <div class="flex gap-2">
                        <textarea id="smart-paste-input" rows="2" class="flex-1 text-xs border border-blue-200 dark:border-blue-800 dark:bg-slate-800 rounded-md p-2 outline-none focus:ring-2 focus:ring-blue-500" placeholder="Paste bill text here..."></textarea>
                        <button id="apply-smart-paste" class="bg-blue-600 text-white px-4 py-2 rounded-md text-sm font-bold hover:bg-blue-700 transition-colors" data-t="extractInfo">提取</button>
                    </div>
                </div>

                <form id="bill-form" class="space-y-4">
                    <input type="hidden" id="bill-id">
                    
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-1" data-t="useTemplate">使用範本</label>
                        <select id="bill-template-select" class="w-full border border-gray-300 dark:border-slate-700 dark:bg-slate-800 rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">Select template...</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-1" data-t="billName">帳單名稱 *</label>
                            <input type="text" id="bill-name" required class="w-full border border-gray-300 dark:border-slate-700 dark:bg-slate-800 rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1" data-t="category">類別 *</label>
                            <select id="bill-category" required class="w-full border border-gray-300 dark:border-slate-700 dark:bg-slate-800 rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500"></select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1" data-t="amount">金額 *</label>
                            <input type="number" id="bill-amount" required step="0.01" class="w-full border border-gray-300 dark:border-slate-700 dark:bg-slate-800 rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1" data-t="amountType">金額類型</label>
                            <select id="bill-amount-type" class="w-full border border-gray-300 dark:border-slate-700 dark:bg-slate-800 rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="fixed" data-t="fixed">固定 (Fixed)</option>
                                <option value="variable" data-t="variable">變動 (Variable)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1" data-t="dueDate">到期日 *</label>
                            <input type="date" id="bill-due-date" required class="w-full border border-gray-300 dark:border-slate-700 dark:bg-slate-800 rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1" data-t="frequency">支付週期</label>
                            <select id="bill-frequency" class="w-full border border-gray-300 dark:border-slate-700 dark:bg-slate-800 rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="One-time" data-t="oneTime">單次支付 (One-time)</option>
                                <option value="Monthly" data-t="monthly">每月固定支付 (Monthly)</option>
                                <option value="Quarterly" data-t="quarterly">每季支付 (Quarterly)</option>
                                <option value="Semi-Annual" data-t="semiAnnual">每半年支付 (Semi-Annual)</option>
                                <option value="Annual" data-t="annual">每年支付 (Annual)</option>
                            </select>
                        </div>
                        <div>

                             text.match(/(\d{1,2}[-\/]\d{1,2}[-\/]\d{4})/);
            
            let name = "";
            const nameKeywords = ["帳單", "bill", "invoice", "單據", "payment"];
            const lines = text.split('\n');
            for (let line of lines) {
                if (nameKeywords.some(k => line.toLowerCase().includes(k))) {
                    name = line.replace(/[:：].*/, '').trim();
                    break;
                }
            }
            if (!name) name = lines[0].substring(0, 30).trim();

            const payableMatch = text.match(/(?:付給|payable to|pay to|抬頭|recipient)[:：]\s?([^\n,，]*)/i);
            const accountMatch = text.match(/(?:帳號|帳戶|account|acc)[:：]?\s?([a-z0-9\-\s]{5,20})/i);

            if (amountMatch) document.getElementById('bill-amount').value = amountMatch[1];
            if (dateMatch) {
                let d = dateMatch[0].replace(/\//g, '-');
                if (d.match(/^\d{1,2}-\d{1,2}-\d{4}$/)) {
                    const parts = d.split('-');
                    d = `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
                }
                document.getElementById('bill-due-date').value = d;
            }
            if (name) document.getElementById('bill-name').value = name;
            if (payableMatch) document.getElementById('bill-payable').value = payableMatch[1].trim();
            if (accountMatch) {
                const remark = document.getElementById('bill-remark');
                remark.value = (remark.value ? remark.value + "\n" : "") + "Acc: " + accountMatch[1].trim();
            }

            alert(state.lang === 'zh' ? '已嘗試提取資訊，請檢查並完善表單。' : 'Information extracted. Please review and complete the form.');
        });

        // --- Core Functions ---
        function migrateData() {
            state.bills.forEach(b => {
                if (!b.amountType) b.amountType = 'fixed';
            });
            state.templates.forEach(t => {
                if (!t.amountType) t.amountType = 'fixed';
            });
        }

        function updateUI() {
            migrateData();
            if (state.dark) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
            document.getElementById('dark-icon').setAttribute('data-lucide', state.dark ? 'sun' : 'moon');
            
            document.getElementById('lang-text').innerText = state.lang === 'zh' ? 'EN' : '中文';
            document.querySelectorAll('[data-t]').forEach(el => {
                const key = el.getAttribute('data-t');
                if (i18n[state.lang][key]) {
                    if (el.tagName === 'INPUT' && el.getAttribute('placeholder')) {
                        el.setAttribute('placeholder', i18n[state.lang][key]);
                    } else if (el.tagName === 'TEXTAREA' && el.getAttribute('placeholder')) {
                        el.setAttribute('placeholder', i18n[state.lang][key]);
                    } else {
                        el.innerText = i18n[state.lang][key];
                    }
                }
            });

            lucide.createIcons();
            renderAll();
        }

        function saveData() {
            localStorage.setItem('bm_bills', JSON.stringify(state.bills));
            localStorage.setItem('bm_templates', JSON.stringify(state.templates));
            localStorage.setItem('bm_categories', JSON.stringify(state.categories));
            localStorage.setItem('bm_lang', state.lang);
            localStorage.setItem('bm_dark', state.dark);
            renderAll();
        }

        // --- Modals ---
        const modals = {
            bill: document.getElementById('bill-modal'),
            payment: document.getElementById('payment-modal'),
            template: document.getElementById('template-modal'),
            export: document.getElementById('export-modal'),
            category: document.getElementById('category-modal'),
            settings: document.getElementById('settings-modal')
        };

        function openModal(m) { m.classList.remove('hidden'); }
        function closeModal(m) { m.classList.add('hidden'); }
        document.querySelectorAll('.close-modal').forEach(btn => {
            btn.addEventListener('click', () => Object.values(modals).forEach(closeModal));
        });

        // --- Bill Logic ---
        document.getElementById('add-bill-btn').addEventListener('click', () => {
            document.getElementById('bill-form').reset();
            document.getElementById('bill-id').value = '';
            document.getElementById('smart-paste-input').value = '';
            openModal(modals.bill);
        });

        document.getElementById('bill-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('bill-id').value || Date.now().toString();
            const data = {
                id,
                name: document.getElementById('bill-name').value,
                category: document.getElementById('bill-category').value,
                amount: parseFloat(document.getElementById('bill-amount').value),
                amountType: document.getElementById('bill-amount-type').value,
                dueDate: document.getElementById('bill-due-date').value,
                payer: document.getElementById('bill-payer').value,
                frequency: document.getElementById('bill-frequency').value,
                payable: document.getElementById('bill-payable').value,
                account: document.getElementById('bill-account').value,
                remark: document.getElementById('bill-remark').value,
                status: 'Unpaid'
            };

            const idx = state.bills.findIndex(b => b.id === id);
            if (idx > -1) {
                data.status = state.bills[idx].status;
                data.payment = state.bills[idx].payment;
                state.bills[idx] = data;
            } else {
                state.bills.push(data);
            }

            saveData();
            closeModal(modals.bill);
        });

        // --- Payment Logic ---
        function markAsPaid(id) {
            const bill = state.bills.find(b => b.id === id);
            if (!bill) return;
            
            document.getElementById('pay-bill-id').value = id;
            document.getElementById('pay-summary').innerHTML = `
                <div class="font-bold">${bill.name}</div>
                <div>$${bill.amount.toLocaleString()} | ${bill.dueDate}</div>
            `;
            document.getElementById('pay-date').value = new Date().toISOString().split('T')[0];
            updatePayFields('Transfer');
            openModal(modals.payment);
        }

        document.getElementById('pay-method').addEventListener('change', (e) => updatePayFields(e.target.value));

        function updatePayFields(method) {
            const container = document.getElementById('pay-dynamic-fields');
            container.innerHTML = '';
            if (method === 'Cheque') {
                container.innerHTML = `
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1">Cheque No (支票號碼)</label>
                        <input type="text" id="pay-cheque-no" required class="w-full border border-gray-300 dark:border-slate-700 dark:bg-slate-800 rounded-lg px-4 py-2 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1">Bank (銀行)</label>
                        <input type="text" id="pay-bank" required class="w-full border border-gray-300 dark:border-slate-700 dark:bg-slate-800 rounded-lg px-4 py-2 outline-none">
                    </div>
                `;
            } else if (method === 'Cash') {
                container.innerHTML = `
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1">Location (地點)</label>
                        <input type="text" id="pay-location" required class="w-full border border-gray-300 dark:border-slate-700 dark:bg-slate-800 rounded-lg px-4 py-2 outline-none">
                    </div>
                `;
            }
        }

        document.getElementById('payment-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('pay-bill-id').value;
            const bill = state.bills.find(b => b.id === id);
            if (!bill) return;

            const method = document.getElementById('pay-method').value;
            bill.status = 'Paid';
            bill.payment = {
                method,
                date: document.getElementById('pay-date').value,
                chequeNo: document.getElementById('pay-cheque-no')?.value || '',
                bank: document.getElementById('pay-bank')?.value || '',
                location: document.getElementById('pay-location')?.value || ''
            };

            if (bill.frequency !== 'One-time') {
                const nextDate = new Date(bill.dueDate);
                if (bill.frequency === 'Monthly') nextDate.setMonth(nextDate.getMonth() + 1);
                else if (bill.frequency === 'Quarterly') nextDate.setMonth(nextDate.getMonth() + 3);
                else if (bill.frequency === 'Semi-Annual') nextDate.setMonth(nextDate.getMonth() + 6);
                else if (bill.frequency === 'Annual') nextDate.setFullYear(nextDate.getFullYear() + 1);

                const nextDueDate = nextDate.toISOString().split('T')[0];
                const exists = state.bills.some(b => b.name === bill.name && b.dueDate === nextDueDate);
                
                if (!exists) {
                    const nextBill = {
                        ...bill,
                        id: Date.now().toString() + "_next",
                        dueDate: nextDueDate,
                        amount: bill.amountType === 'variable' ? 0 : bill.amount,
                        status: 'Unpaid',
                        payment: null
                    };
                    state.bills.push(nextBill);
                }
            }

            saveData();
            closeModal(modals.payment);
        });

        // --- Rendering ---
        function renderDashboard() {
            const now = new Date();
            now.setHours(0,0,0,0);
            const next30 = new Date(now); next30.setDate(now.getDate() + 30);

            const unpaid = state.bills.filter(b => b.status === 'Unpaid');
            const totalUnpaid = unpaid.reduce((s, b) => s + b.amount, 0);
            const overdueBills = unpaid.filter(b => new Date(b.dueDate) < now);
            const due30Bills = unpaid.filter(b => {
                const d = new Date(b.dueDate);
                return d >= now && d <= next30;
            });

            const paidThisMonth = state.bills.filter(b => {
                if (b.status !== 'Paid' || !b.payment) return false;
                const d = new Date(b.payment.date);
                return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
            }).reduce((s, b) => s + b.amount, 0);

            document.getElementById('stat-total-unpaid').innerText = `$${totalUnpaid.toLocaleString()}`;
            document.getElementById('stat-due-30').innerText = due30Bills.length;
            document.getElementById('stat-overdue').innerText = overdueBills.length;
            document.getElementById('stat-paid-month').innerText = `$${paidThisMonth.toLocaleString()}`;

            renderDashList('overdue-list', overdueBills);
            renderDashList('upcoming-30-list', due30Bills);
        }

        function renderBillsTable() {
            const tbody = document.getElementById('bills-table-body');
            const search = document.getElementById('search-bills').value.toLowerCase();
            const year = document.getElementById('filter-year').value;
            const month = document.getElementById('filter-month').value;
            const cat = document.getElementById('filter-category').value;

            const statusFilter = document.getElementById('filter-status').value;
            let filtered = state.bills.filter(b => {
                const date = new Date(b.dueDate);
                const mSearch = b.name.toLowerCase().includes(search) || (b.remark && b.remark.toLowerCase().includes(search));
                const mYear = year === 'all' || date.getFullYear().toString() === year;
                const mMonth = month === 'all' || (date.getMonth() + 1).toString() === month;
                const mCat = cat === 'all' || b.category === cat;
                
                let mStatus = statusFilter === 'all' || b.status === statusFilter;
                if (statusFilter === 'Overdue') {
                    const now = new Date(); now.setHours(0,0,0,0);
                    mStatus = b.status === 'Unpaid' && new Date(b.dueDate) < now;
                }

                return mSearch && mYear && mMonth && mCat && mStatus;
            });

            filtered.sort((a, b) => {
                let valA, valB;
                if (state.sort.field === 'amount') { valA = a.amount; valB = b.amount; }
                else if (state.sort.field === 'dueDate') { valA = new Date(a.dueDate).getTime(); valB = new Date(b.dueDate).getTime(); }
                else if (state.sort.field === 'status') { 
                    const order = { 'Overdue': 0, 'Unpaid': 1, 'Paid': 2 };
                    const getStatus = (bill) => {
                        if (bill.status === 'Paid') return 'Paid';
                        if (new Date(bill.dueDate) < new Date().setHours(0,0,0,0)) return 'Overdue';
                        return 'Unpaid';
                    };
                    valA = order[getStatus(a)];
                    valB = order[getStatus(b)];
                }
                
                if (state.sort.order === 'asc') return valA > valB ? 1 : -1;
                else return valA < valB ? 1 : -1;
            });

            tbody.innerHTML = filtered.length ? '' : `<tr><td colspan="5" class="p-12 text-center text-gray-400 italic">${i18n[state.lang].noBills}</td></tr>`;

            filtered.forEach(b => {
                const isOverdue = new Date(b.dueDate) < new Date().setHours(0,0,0,0) && b.status === 'Unpaid';
                const statusLabel = b.status === 'Paid' ? i18n[state.lang].paid : (isOverdue ? i18n[state.lang].overdue : i18n[state.lang].unpaid);
                const statusClass = b.status === 'Paid' ? 'bg-green-100 text-green-700' : (isOverdue ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700');

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 dark:hover:bg-slate-800 transition-colors cursor-pointer" onclick="toggleBillDetail('${b.id}', 'bill')">
                        <td class="px-6 py-4">
                            <div class="font-bold text-gray-900 dark:text-slate-200 flex items-center gap-2">
                                <i data-lucide="chevron-right" class="w-3 h-3 transition-transform" id="icon-bill-${b.id}"></i>
                                ${b.name}
                            </div>
                        </td>
                        <td class="px-6 py-4 font-bold">$${b.amount.toLocaleString()}</td>
                        <td class="px-6 py-4">
                            <div class="${isOverdue ? 'text-red-600 font-bold' : ''}">${b.dueDate}</div>
                        </td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 rounded-full text-[10px] font-bold ${statusClass}">${statusLabel}</span>
                        </td>
                        <td class="px-6 py-4 text-right" onclick="event.stopPropagation()">
                            <div class="flex justify-end gap-1">
                                ${b.status === 'Unpaid' ? `<button onclick="markAsPaid('${b.id}')" class="p-1.5 hover:bg-green-50 text-green-600 rounded"><i data-lucide="check-square" class="w-4 h-4"></i></button>` : `<button onclick="recallPayment('${b.id}')" class="p-1.5 hover:bg-orange-50 text-orange-600 rounded" title="${i18n[state.lang].recallPayment}"><i data-lucide="rotate-ccw" class="w-4 h-4"></i></button>`}
                                <button onclick="editBill('${b.id}')" class="p-1.5 hover:bg-gray-100 dark:hover:bg-slate-700 rounded"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                                <button onclick="deleteBill('${b.id}')" class="p-1.5 hover:bg-red-50 dark:hover:bg-red-900/30 text-red-600 rounded"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                        </td>
                    </tr>
                    <tr id="detail-bill-${b.id}" class="hidden bg-gray-50/50 dark:bg-slate-800/30">
                        <td colspan="5" class="px-12 py-6">
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-6 text-sm">
                                <div><p class="text-gray-500 font-medium" data-t="category">類別</p><p>${b.category}</p></div>
                                <div><p class="text-gray-500 font-medium" data-t="payer">付款人</p><p>${b.payer || '-'}</p></div>
                                <div><p class="text-gray-500 font-medium" data-t="payableTo">抬頭</p><p>${b.payable || '-'}</p></div>
                                <div><p class="text-gray-500 font-medium" data-t="accountNo">付款帳號</p><p>${b.account || '-'}</p></div>
                                <div><p class="text-gray-500 font-medium" data-t="frequency">週期</p><p>${i18n[state.lang][b.frequency.toLowerCase()] || b.frequency}</p></div>
                                <div class="col-span-2"><p class="text-gray-500 font-medium" data-t="remark">備註</p><p>${b.remark || '-'}</p></div>
                                ${b.payment ? `
                                <div class="col-span-2 bg-green-50 dark:bg-green-900/10 p-3 rounded-lg border border-green-100 dark:border-green-900/20">
                                    <p class="font-bold text-green-700 mb-1" data-t="confirmPayment">付款詳情</p>
                                    <p>${b.payment.date} | ${b.payment.method} ${b.payment.chequeNo ? `(#${b.payment.chequeNo} @ ${b.payment.bank})` : ''}</p>
                                </div>` : ''}
                            </div>
                        </td>
                    </tr>
                `;
            });
            lucide.createIcons();
        }

        window.toggleBillDetail = (id, prefix) => {
            const row = document.getElementById(`detail-${prefix}-${id}`);
            const icon = document.getElementById(`icon-${prefix}-${id}`);
            if (row) row.classList.toggle('hidden');

            document.getElementById(id).addEventListener('click', () => {
                const field = id.replace('sort-', '');
                if (state.sort.field === field) state.sort.order = state.sort.order === 'asc' ? 'desc' : 'asc';

        function renderHistory() {
            const container = document.getElementById('history-content');
            const year = document.getElementById('history-year').value;
            const month = document.getElementById('history-month').value;
            const search = document.getElementById('search-history').value.toLowerCase();
            const paidBills = state.bills.filter(b => b.status === 'Paid' && b.payment);
            
            const groups = {};
            paidBills.forEach(b => {
                const d = new Date(b.payment.date);
                const mYear = year === 'all' || d.getFullYear().toString() === year;
                const mMonth = month === 'all' || (d.getMonth() + 1).toString() === month;
                
                const searchMatch = !search || 
                    b.name.toLowerCase().includes(search) || 
                    (b.payment.chequeNo && b.payment.chequeNo.toLowerCase().includes(search)) ||
                    (b.account && b.account.toLowerCase().includes(search)) ||
                    (b.payable && b.payable.toLowerCase().includes(search)) ||
                    b.amount.toString().includes(search);

                const key = d.toISOString().split('T')[0];
                if (!groups[key]) groups[key] = [];
                groups[key].push(b);

            const sortedKeys = Object.keys(groups).sort().reverse();

            lucide.createIcons();

        // --- Cheque Book History ---
        function renderChequeHistory() {
            const tbody = document.getElementById('cheque-table-body');
            const bankFilter = document.getElementById('cheque-bank-filter').value;
            const search = document.getElementById('search-cheque').value.toLowerCase();

            const chequeBills = state.bills.filter(b => 
                b.status === 'Paid' && 
                b.payment && 
                b.payment.method === 'Cheque' &&
                b.payment.chequeNo
            );

            let filtered = chequeBills.filter(b => {
                const bankMatch = bankFilter === 'all' || b.payment.bank === bankFilter;
                const searchMatch = !search || 
                    b.payment.chequeNo.toLowerCase().includes(search) ||
                    (b.payable && b.payable.toLowerCase().includes(search)) ||
                    b.name.toLowerCase().includes(search) ||
                    b.amount.toString().includes(search);
                return bankMatch && searchMatch;
            });

            filtered.sort((a, b) => {
                const chequeA = parseInt(a.payment.chequeNo) || 0;
                const chequeB = parseInt(b.payment.chequeNo) || 0;
                return chequeA - chequeB;
            });

            tbody.innerHTML = filtered.length ? '' : `<tr><td colspan="6" class="p-12 text-center text-gray-400 italic">No cheque records found</td></tr>`;

            filtered.forEach(b => {
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 dark:hover:bg-slate-800 transition-colors">
                        <td class="px-6 py-4 font-bold">${b.payment.bank}</td>
                        <td class="px-6 py-4 font-mono font-bold text-blue-600">${b.payment.chequeNo}</td>
                        <td class="px-6 py-4">${b.payable || '-'}</td>
                        <td class="px-6 py-4 font-bold">$${b.amount.toLocaleString()}</td>
                        <td class="px-6 py-4">${b.payment.date}</td>
                        <td class="px-6 py-4 text-sm text-gray-600 dark:text-slate-400">${b.name}</td>
                    </tr>
                `;
            });
            lucide.createIcons();
        }

        function updateChequeFilterOptions() {
            const chequeBills = state.bills.filter(b => 
                b.status === 'Paid' && 
                b.payment && 
                b.payment.method === 'Cheque' &&
                b.payment.bank
            );
            const banks = [...new Set(chequeBills.map(b => b.payment.bank))].sort();
            const select = document.getElementById('cheque-bank-filter');
            const currentValue = select.value;
            
            select.innerHTML = `<option value="all">All Banks</option>`;
            banks.forEach(bank => {
                select.innerHTML += `<option value="${bank}">${bank}</option>`;
            });
            select.value = currentValue;
        }

        function updateFilterOptions() {
            const years = [...new Set(state.bills.map(b => {
                const d = new Date(b.dueDate);
                return isNaN(d.getTime()) ? null : d.getFullYear();
            }).filter(y => y !== null))].sort().reverse();
            
            const ySelect = document.getElementById('filter-year');
            const hySelect = document.getElementById('history-year');
            
            const currentY = ySelect.value;
            ySelect.innerHTML = `<option value="all">${i18n[state.lang].allYears}</option>`;
            hySelect.innerHTML = `<option value="all">${i18n[state.lang].allYears}</option>`;
            
            years.forEach(y => {
                const opt = `<option value="${y}" ${y.toString() === currentY ? 'selected' : ''}>${y}</option>`;
                ySelect.innerHTML += opt;
                hySelect.innerHTML += opt;
            });

            const cats = [...new Set(state.bills.map(b => b.category))];
            const cSelect = document.getElementById('filter-category');
            const currentC = cSelect.value;
            cSelect.innerHTML = `<option value="all">${i18n[state.lang].allCategories}</option>`;
            cats.forEach(c => {
                cSelect.innerHTML += `<option value="${c}" ${c === currentC ? 'selected' : ''}>${c}</option>`;
            });

            // Update all category selects
            const formCatSelects = ['bill-category', 'tpl-category'];
            formCatSelects.forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                const current = el.value;
                el.innerHTML = '';
                state.categories.forEach(c => {
                    el.innerHTML += `<option value="${c}" ${c === current ? 'selected' : ''}>${c}</option>`;
                });
            });

            updateChequeFilterOptions();
        }

        // --- Templates ---
        function renderTemplates() {
            const grid = document.getElementById('templates-grid');
            const select = document.getElementById('bill-template-select');
            grid.innerHTML = state.templates.length ? '' : `<div class="col-span-full p-12 text-center text-gray-400 border-2 border-dashed border-gray-200 dark:border-slate-800 rounded-xl">No templates yet.</div>`;
            select.innerHTML = `<option value="">${state.lang === 'zh' ? '選擇範本...' : 'Select template...'}</option>`;

            state.templates.forEach(t => {
                grid.innerHTML += `
                    <div class="bg-white dark:bg-slate-800 p-6 rounded-xl border border-gray-100 dark:border-slate-700 shadow-sm hover:shadow-md transition-shadow group">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h5 class="font-bold text-gray-900 dark:text-slate-200">${t.name}</h5>
                                <span class="text-[10px] bg-gray-100 dark:bg-slate-700 text-gray-600 dark:text-slate-400 px-2 py-0.5 rounded uppercase">${t.category}</span>
                            </div>
                            <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                <button onclick="editTemplate('${t.id}')" class="p-1.5 hover:bg-blue-50 dark:hover:bg-blue-900/30 text-blue-600 rounded"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                                <button onclick="deleteTemplate('${t.id}')" class="p-1.5 hover:bg-red-50 dark:hover:bg-red-900/30 text-red-600 rounded"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                        </div>
                        <div class="text-xs text-gray-500 space-y-1">
                            <p><span class="font-medium">Payer:</span> ${t.payer || '-'}</p>
                            <p><span class="font-medium">Payable:</span> ${t.payable || '-'}</p>
                            <p><span class="font-medium">Acc No:</span> ${t.account || '-'}</p>
                        </div>
                    </div>
                `;
                select.innerHTML += `<option value="${t.id}">${t.name}</option>`;
            });
            lucide.createIcons();
        }

        document.getElementById('bill-template-select').addEventListener('change', (e) => {
            const tpl = state.templates.find(t => t.id === e.target.value);
            if (tpl) {
                document.getElementById('bill-name').value = tpl.name;
                document.getElementById('bill-category').value = tpl.category;
                document.getElementById('bill-payer').value = tpl.payer;
                document.getElementById('bill-payable').value = tpl.payable;
                document.getElementById('bill-account').value = tpl.account || '';
                document.getElementById('bill-amount-type').value = tpl.amountType || 'fixed';
                if (tpl.address) document.getElementById('bill-remark').value = tpl.address;
            }
        });

        // Category Management
        document.getElementById('manage-cats-btn').addEventListener('click', () => {
            renderCatList();
            openModal(modals.category);
        });

        document.getElementById('add-cat-btn').addEventListener('click', () => {
            const input = document.getElementById('new-cat-input');
            const val = input.value.trim();
            if (val && !state.categories.includes(val)) {
                state.categories.push(val);
                input.value = '';
                saveData();
                renderCatList();
                updateFilterOptions();
            }
        });

        window.deleteCategory = (cat) => {
            if (confirm(`Delete category "${cat}"?`)) {
                state.categories = state.categories.filter(c => c !== cat);
                saveData();
                renderCatList();
                updateFilterOptions();
            }
        };

        function renderCatList() {
            const list = document.getElementById('cat-list');
            list.innerHTML = state.categories.map(c => `
                <div class="flex justify-between items-center p-2 bg-gray-50 dark:bg-slate-800 rounded">
                    <span>${c}</span>
                    <button onclick="deleteCategory('${c}')" class="text-red-500 hover:text-red-700"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        // --- Event Listeners ---
        document.getElementById('toggle-lang').addEventListener('click', () => {
            state.lang = state.lang === 'zh' ? 'en' : 'zh';
            saveData();
            updateUI();
        });

        document.getElementById('toggle-dark').addEventListener('click', () => {
            state.dark = !state.dark;
            saveData();
            updateUI();
        });

        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('tab-active'));
                tab.classList.add('tab-active');
                document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
                document.getElementById(`tab-${tab.dataset.tab}`).classList.remove('hidden');
                state.currentTab = tab.dataset.tab;
                renderAll();
            });
        });

        document.getElementById('export-btn').addEventListener('click', () => openModal(modals.export));
        document.getElementById('export-all').addEventListener('click', () => exportData('all'));
        document.getElementById('export-unpaid').addEventListener('click', () => exportData('unpaid'));
        document.getElementById('export-monthly').addEventListener('click', () => exportData('monthly'));
        document.getElementById('export-upcoming-2').addEventListener('click', () => exportData('upcoming_2_months'));

        function exportData(type) {
            let data = [...state.bills];
            const now = new Date();
            
            if (type === 'unpaid') {
                data = data.filter(b => b.status === 'Unpaid');
            } else if (type === 'monthly') {
                data = data.filter(b => {
                    const d = new Date(b.dueDate);
                    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                });
            } else if (type === 'upcoming_2_months') {
                const next2Months = new Date(now);
                next2Months.setMonth(now.getMonth() + 2);
                data = data.filter(b => {
                    const d = new Date(b.dueDate);
                    return b.status === 'Unpaid' && d >= now && d <= next2Months;
                });
            }

            if (data.length === 0) {
                alert(state.lang === 'zh' ? '沒有可匯出的資料' : 'No data to export');
                return;
            }

            data.sort((a,b) => new Date(a.dueDate) - new Date(b.dueDate));

            const headers = ['Bill Name', 'Category', 'Amount', 'Due Date', 'Status', 'Frequency', 'Payer', 'Payable To', 'Payment Method', 'Payment Date', 'Cheque No', 'Bank', 'Remark'];
            const rows = data.map(b => [
                `"${b.name}"`, 
                `"${b.category}"`, 
                b.amount, 
                b.dueDate, 
                `"${b.status}"`, 
                `"${b.frequency}"`, 
                `"${b.payer || ''}"`, 
                `"${b.payable || ''}"`,
                `"${b.payment?.method || ''}"`, 
                `"${b.payment?.date || ''}"`, 
                `"${b.payment?.chequeNo || ''}"`, 
                `"${b.payment?.bank || ''}"`,
                `"${(b.remark || '').replace(/"/g, '""')}"`
            ]);

            let csvContent = "\uFEFF" + headers.join(",") + "\n" + rows.map(r => r.join(",")).join("\n");
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `Company_Bills_${type}_${now.toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            closeModal(modals.export);
        }

        // Helpers for CRUD
        window.deleteBill = (id) => { if(confirm('Confirm delete?')) { state.bills = state.bills.filter(b => b.id !== id); saveData(); } };
        window.recallPayment = (id) => {
            if (confirm(i18n[state.lang].confirmRecall)) {
                const b = state.bills.find(x => x.id === id);
                if (b) {
                    b.status = 'Unpaid';
                    delete b.payment;
                    saveData();
                }
            }
        };
        window.editBill = (id) => {
            const b = state.bills.find(x => x.id === id);
            if(!b) return;
            document.getElementById('bill-id').value = b.id;
            document.getElementById('bill-name').value = b.name;
            document.getElementById('bill-category').value = b.category;
            document.getElementById('bill-amount').value = b.amount;
            document.getElementById('bill-amount-type').value = b.amountType || 'fixed';
            document.getElementById('bill-due-date').value = b.dueDate;
            document.getElementById('bill-payer').value = b.payer;
            document.getElementById('bill-frequency').value = b.frequency;
            document.getElementById('bill-payable').value = b.payable;
            document.getElementById('bill-account').value = b.account || '';
            document.getElementById('bill-remark').value = b.remark;
            openModal(modals.bill);
        };

        // Template CRUD
        document.getElementById('add-template-btn').addEventListener('click', () => {
            document.getElementById('template-form').reset();
            document.getElementById('template-id').value = '';
            openModal(modals.template);
        });

        document.getElementById('template-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('template-id').value || Date.now().toString();
            const data = {
                id,
                name: document.getElementById('tpl-name').value,
                category: document.getElementById('tpl-category').value,
                payer: document.getElementById('tpl-payer').value,
                payable: document.getElementById('tpl-payable').value,
                account: document.getElementById('tpl-account').value,
                address: document.getElementById('tpl-address').value,
                amountType: document.getElementById('tpl-amount-type').value
            };
            const idx = state.templates.findIndex(t => t.id === id);
            if (idx > -1) state.templates[idx] = data;
            else state.templates.push(data);
            saveData();
            closeModal(modals.template);
        });

        window.deleteTemplate = (id) => { if(confirm('Delete template?')) { state.templates = state.templates.filter(t => t.id !== id); saveData(); } };
        window.editTemplate = (id) => {
            const t = state.templates.find(x => x.id === id);
            if(!t) return;
            document.getElementById('template-id').value = t.id;
            document.getElementById('tpl-name').value = t.name;
            document.getElementById('tpl-category').value = t.category;
            document.getElementById('tpl-payer').value = t.payer;
            document.getElementById('tpl-payable').value = t.payable;
            document.getElementById('tpl-account').value = t.account;
            document.getElementById('tpl-address').value = t.address;
            document.getElementById('tpl-amount-type').value = t.amountType || 'fixed';
            openModal(modals.template);
        };

        function renderAll() {
            renderDashboard();
            renderBillsTable();
            renderTemplates();
            renderHistory();
            renderChequeHistory();
            updateFilterOptions();
        }

        // Filter triggers
        ['filter-year', 'filter-month', 'filter-category', 'filter-status', 'search-bills'].forEach(id => {
            document.getElementById(id).addEventListener('input', renderBillsTable);
        });
        document.getElementById('history-year').addEventListener('change', renderHistory);
        document.getElementById('history-month').addEventListener('change', renderHistory);
        document.getElementById('search-history').addEventListener('input', renderHistory);
        document.getElementById('cheque-bank-filter').addEventListener('change', renderChequeHistory);
        document.getElementById('search-cheque').addEventListener('input', renderChequeHistory);

        window.onload = () => {
            if (!state.isLoggedIn) {
                document.getElementById('login-modal').classList.remove('hidden');
                document.getElementById('app').classList.add('hidden');
            } else {
                updateUI();
            }
        };
    </script>
</body>
</html>
