<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公司帳單管理系統 | Company Bill Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; transition: background-color 0.3s, color 0.3s; }
        .dark { background-color: #0f172a; color: #f8fafc; }
        .dark .bg-white { background-color: #1e293b; color: #f8fafc; }
        .dark .bg-gray-50 { background-color: #0f172a; }
        .dark .border-gray-100, .dark .border-gray-200 { border-color: #334155; }
        .dark .text-gray-500 { color: #94a3b8; }
        .dark .text-gray-900 { color: #f8fafc; }
        .dark .hover\:bg-gray-50:hover { background-color: #334155; }
        .tab-active { border-bottom: 2px solid #3b82f6; color: #3b82f6; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        [v-cloak] { display: none; }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        darkCard: '#1e293b',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
    <div id="app" class="max-w-[1400px] mx-auto px-4 py-8">
        <header class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
            <div>
                <h1 class="text-2xl font-bold flex items-center gap-2">
                    <i data-lucide="shield-check" class="text-blue-600"></i>
                    <span data-t="title">公司帳單管理系統</span>
                </h1>
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <button id="toggle-lang" class="p-2 rounded-lg border border-gray-200 dark:border-slate-700 hover:bg-gray-100 dark:hover:bg-slate-800 transition-colors">
                    <span id="lang-text">EN</span>
                </button>
                <button id="toggle-dark" class="p-2 rounded-lg border border-gray-200 dark:border-slate-700 hover:bg-gray-100 dark:hover:bg-slate-800 transition-colors">
                    <i data-lucide="moon" id="dark-icon" class="w-5 h-5"></i>
                </button>
                <button id="add-bill-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition-colors shadow-lg shadow-blue-500/20">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i>
                    <span data-t="addBill">新增帳單</span>
                </button>
                <button id="export-btn" class="bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 hover:bg-gray-50 dark:hover:bg-slate-700 px-4 py-2 rounded-lg flex items-center gap-2 transition-colors shadow-sm">
                    <i data-lucide="download" class="w-4 h-4"></i>
                    <span data-t="export">匯出</span>
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center gap-4">
                <div class="p-3 bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 rounded-lg">
                    <i data-lucide="wallet" class="w-6 h-6"></i>
                </div>
                <div>
                    <p class="text-xs text-gray-500 font-medium uppercase tracking-wider" data-t="statUnpaid">未付總額</p>
                    <h3 id="stat-total-unpaid" class="text-xl font-bold">$0.00</h3>
                </div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center gap-4">
                <div class="p-3 bg-yellow-50 dark:bg-yellow-900/30 text-yellow-600 dark:text-yellow-400 rounded-lg">
                    <i data-lucide="clock" class="w-6 h-6"></i>
                </div>
                <div>
                    <p class="text-xs text-gray-500 font-medium uppercase tracking-wider" data-t="stat30">30天內到期</p>
                    <h3 id="stat-due-30" class="text-xl font-bold">0</h3>
                </div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center gap-4">
                <div class="p-3 bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 rounded-lg">
                    <i data-lucide="alert-circle" class="w-6 h-6"></i>
                </div>
                <div>
                    <p class="text-xs text-gray-500 font-medium uppercase tracking-wider" data-t="statOverdue">已逾期</p>
                    <h3 id="stat-overdue" class="text-xl font-bold">0</h3>
                </div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center gap-4">
                <div class="p-3 bg-green-50 dark:bg-green-900/30 text-green-600 dark:text-green-400 rounded-lg">
                    <i data-lucide="check-circle" class="w-6 h-6"></i>
                </div>
                <div>
                    <p class="text-xs text-gray-500 font-medium uppercase tracking-wider" data-t="statPaid">本月已付</p>
                    <h3 id="stat-paid-month" class="text-xl font-bold">$0.00</h3>
                </div>
            </div>
        </div>

        <nav class="flex border-b border-gray-200 dark:border-slate-700 mb-8 overflow-x-auto no-scrollbar">
            <button data-tab="dashboard" class="nav-tab px-6 py-3 font-medium text-sm whitespace-nowrap tab-active" data-t="tabDashboard">儀表板</button>
            <button data-tab="bills" class="nav-tab px-6 py-3 font-medium text-sm whitespace-nowrap text-gray-500 hover:text-gray-700 dark:hover:text-slate-300" data-t="tabBills">所有帳單</button>
            <button data-tab="templates" class="nav-tab px-6 py-3 font-medium text-sm whitespace-nowrap text-gray-500 hover:text-gray-700 dark:hover:text-slate-300" data-t="tabTemplates">範本管理</button>
            <button data-tab="history" class="nav-tab px-6 py-3 font-medium text-sm whitespace-nowrap text-gray-500 hover:text-gray-700 dark:hover:text-slate-300" data-t="tabHistory">歷史紀錄</button>
        </nav>

        <main>
            <section id="tab-dashboard" class="tab-content">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 dark:border-slate-700 overflow-hidden">
                        <div class="px-6 py-4 border-b border-gray-100 dark:border-slate-700 flex justify-between items-center bg-red-50/50 dark:bg-red-900/10">
                            <h4 class="font-bold text-red-700 dark:text-red-400" data-t="statOverdue">已逾期</h4>
                            <span class="text-[10px] bg-red-100 dark:bg-red-900/40 text-red-700 dark:text-red-400 px-2 py-1 rounded-full font-bold uppercase tracking-wider" data-t="urgent">緊急</span>
                        </div>
                        <div id="overdue-list" class="divide-y divide-gray-50 dark:divide-slate-700 max-h-[450px] overflow-y-auto">
                            <div class="p-12 text-center text-gray-400 italic" data-t="noBills">暫無帳單</div>
                        </div>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 dark:border-slate-700 overflow-hidden">
                        <div class="px-6 py-4 border-b border-gray-100 dark:border-slate-700 flex justify-between items-center bg-yellow-50/50 dark:bg-yellow-900/10">
                            <h4 class="font-bold text-yellow-700 dark:text-yellow-400" data-t="next30">未來 30 天</h4>
                            <span class="text-[10px] bg-yellow-100 dark:bg-yellow-900/40 text-yellow-700 dark:text-yellow-400 px-2 py-1 rounded-full font-bold uppercase tracking-wider" data-t="upcoming">即將到期</span>
                        </div>
                        <div id="upcoming-30-list" class="divide-y divide-gray-50 dark:divide-slate-700 max-h-[450px] overflow-y-auto">
                            <div class="p-12 text-center text-gray-400 italic" data-t="noBills">暫無帳單</div>
                        </div>
                    </div>
                </div>
            </section>

            <section id="tab-bills" class="tab-content hidden">
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 dark:border-slate-700 overflow-hidden">
                    <div class="p-4 border-b border-gray-100 dark:border-slate-700 flex flex-col md:flex-row gap-4 items-center justify-between bg-gray-50/50 dark:bg-slate-800/50">
                        <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                            <select id="filter-year" class="text-sm border border-gray-200 dark:border-slate-700 dark:bg-slate-800 rounded-md px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="all" data-t="allYears">所有年份</option>
                            </select>
                            <select id="filter-month" class="text-sm border border-gray-200 dark:border-slate-700 dark:bg-slate-800 rounded-md px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="all" data-t="allMonths">所有月份</option>
                                <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
                                <option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option>
                                <option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option>
                            </select>
                            <select id="filter-category" class="text-sm border border-gray-200 dark:border-slate-700 dark:bg-slate-800 rounded-md px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="all" data-t="allCategories">所有類別</option>
                            </select>
                            <select id="filter-status" class="text-sm border border-gray-200 dark:border-slate-700 dark:bg-slate-800 rounded-md px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="all" data-t="allStatus">所有狀態</option>
                                <option value="Unpaid" data-t="unpaid">未付</option>
                                <option value="Paid" data-t="paid">已付</option>
                                <option value="Overdue" data-t="overdue">逾期</option>
                            </select>
                            <button id="manage-cats-btn" class="text-xs bg-gray-100 dark:bg-slate-700 px-3 py-1.5 rounded hover:bg-gray-200 dark:hover:bg-slate-600 transition-colors" data-t="manageCategories">管理類別</button>
                        </div>
                        <div class="relative w-full md:w-64">
                            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <input type="text" id="search-bills" placeholder="搜尋..." class="w-full text-sm border border-gray-200 dark:border-slate-700 dark:bg-slate-800 rounded-md pl-10 pr-4 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-gray-50 dark:bg-slate-800 text-gray-500 dark:text-slate-400 font-medium border-b border-gray-100 dark:border-slate-700">
                                <tr>
                                    <th class="px-6 py-4" data-t="thName">帳單名稱</th>
                                    <th class="px-6 py-4 cursor-pointer hover:text-blue-600" id="sort-amount" data-t="thAmountSort">金額</th>
                                    <th class="px-6 py-4 cursor-pointer hover:text-blue-600" id="sort-date" data-t="thDateSort">到期日</th>
                                    <th class="px-6 py-4 cursor-pointer hover:text-blue-600" id="sort-status" data-t="thStatusSort">狀態</th>
                                    <th class="px-6 py-4 text-right" data-t="thActions">操作</th>
                                </tr>
                            </thead>
                            <tbody id="bills-table-body" class="divide-y divide-gray-50 dark:divide-slate-700">
                                </tbody>
                        </table>
                    </div>
                </div>
            </section>

            <section id="tab-templates" class="tab-content hidden">
                <div class="mb-6 flex justify-between items-center">
                    <h4 class="font-bold text-lg" data-t="vendorTemplates">範本管理</h4>
                    <button id="add-template-btn" class="text-sm bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 px-4 py-2 rounded-lg font-medium hover:bg-blue-100 transition-colors">
                        <span data-t="createTemplate">建立新範本</span>
                    </button>
                </div>
                <div id="templates-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    </div>
            </section>

            <section id="tab-history" class="tab-content hidden">
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 dark:border-slate-700 p-6">
                    <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                        <h4 class="font-bold text-lg" data-t="paymentHistory">付款歷史紀錄</h4>
                        <div class="flex flex-wrap gap-2 items-center w-full md:w-auto">
                            <div class="relative flex-1 md:flex-none md:w-64">
                                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                <input type="text" id="search-history" placeholder="搜尋歷史..." class="w-full text-sm border border-gray-200 dark:border-slate-700 dark:bg-slate-800 rounded-md pl-10 pr-4 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <select id="history-year" class="text-sm border border-gray-200 dark:border-slate-700 dark:bg-slate-800 rounded-md px-3 py-1.5"></select>
                            <select id="history-month" class="text-sm border border-gray-200 dark:border-slate-700 dark:bg-slate-800 rounded-md px-3 py-1.5">
                                <option value="all" data-t="allMonths">所有月份</option>
                                <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
                                <option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option>
                                <option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option>
                            </select>
                        </div>
                    </div>
                    <div id="history-content" class="space-y-4">
                        </div>
                </div>
            </section>
        </main>

        <div id="bill-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
            <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl w-full max-w-3xl max-h-[90vh] overflow-y-auto">
                <div class="px-6 py-4 border-b border-gray-100 dark:border-slate-800 flex justify-between items-center sticky top-0 bg-white dark:bg-slate-900 z-10">
                    <h3 id="bill-modal-title" class="text-xl font-bold">新增帳單</h3>
                    <button class="close-modal p-2 hover:bg-gray-100 dark:hover:bg-slate-800 rounded-full"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <div class="p-6">
                    <div class="mb-6">
                        <label class="block text-sm font-bold text-blue-600 dark:text-blue-400 mb-2 flex items-center gap-2">
                            <i data-lucide="sparkles" class="w-4 h-4"></i>
                            <span data-t="smartPaste">智能貼上 (從訊息自動提取資訊)</span>
                        </label>
                        <textarea id="smart-paste-input" rows="3" placeholder="貼上長訊息，例如：HKT 帳單，付給 HKT Ltd，金額 $500，到期日 2024-06-30..." class="w-full border border-blue-100 dark:border-blue-900/30 bg-blue-50/30 dark:bg-blue-900/10 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm italic"></textarea>
                        <button id="apply-smart-paste" class="mt-2 text-xs bg-blue-600 text-white px-3 py-1.5 rounded hover:bg-blue-700 transition-colors" data-t="extractInfo">提取資訊</button>
                    </div>

                    <form id="bill-form">
                        <input type="hidden" id="bill-id">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div class="md:col-span-2">
                                <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1" data-t="useTemplate">使用範本</label>
                                <select id="bill-template-select" class="w-full border border-gray-300 dark:border-slate-700 dark:bg-slate-800 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                                    <option value="">選擇範本...</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1" data-t="billName">帳單名稱 *</label>
                                <input type="text" id="bill-name" required class="w-full border border-gray-300 dark:border-slate-700 dark:bg-slate-800 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1" data-t="category">類別 *</label>
                                <select id="bill-category" required class="w-full border border-gray-300 dark:border-slate-700 dark:bg-slate-800 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                                    <option value="Utilities">Utilities (水電煤)</option>
                                    <option value="Rent">Rent (租金)</option>
                                    <option value="Marketing">Marketing (市場推廣)</option>
                                    <option value="Loans">Loans (貸款)</option>
                                    <option value="Telecom">Telecom (通訊)</option>
                                    <option value="Others">Others (其他)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1" data-t="amount">金額 *</label>
                                <div class="flex gap-2">
                                    <input type="number" step="0.01" id="bill-amount" required class="flex-1 border border-gray-300 dark:border-slate-700 dark:bg-slate-800 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                                    <select id="bill-amount-type" class="w-32 border border-gray-300 dark:border-slate-700 dark:bg-slate-800 rounded-lg px-2 py-2 text-xs focus:ring-2 focus:ring-blue-500 outline-none">
                                        <option value="fixed" data-t="fixed">固定 (Fixed)</option>
                                        <option value="variable" data-t="variable">變動 (Variable)</option>
                                    </select>
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1" data-t="dueDate">到期日 *</label>
                                <input type="date" id="bill-due-date" required class="w-full border border-gray-300 dark:border-slate-700 dark:bg-slate-800 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1" data-t="payer">付款人</label>
                                <input type="text" id="bill-payer" class="w-full border border-gray-300 dark:border-slate-700 dark:bg-slate-800 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1" data-t="frequency">支付週期</label>
                                <select id="bill-frequency" class="w-full border border-gray-300 dark:border-slate-700 dark:bg-slate-800 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                                    <option value="One-time" data-t="oneTime">單次支付 (One-time)</option>
                                    <option value="Monthly" data-t="monthly">每月固定支付 (Monthly)</option>
                                    <option value="Quarterly" data-t="quarterly">每季支付 (Quarterly)</option>
                                    <option value="Semi-Annual" data-t="semiAnnual">每半年支付 (Semi-Annual)</option>
                                    <option value="Annual" data-t="annual">每年支付 (Annual)</option>
                                </select>
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1" data-t="payableTo">支票抬頭 (Payable To)</label>
                                <input type="text" id="bill-payable" class="w-full border border-gray-300 dark:border-slate-700 dark:bg-slate-800 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1" data-t="accountNo">付款帳號</label>
                                <input type="text" id="bill-account" class="w-full border border-gray-300 dark:border-slate-700 dark:bg-slate-800 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1" data-t="remark">備註</label>
                                <textarea id="bill-remark" rows="2" class="w-full border border-gray-300 dark:border-slate-700 dark:bg-slate-800 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                            </div>
                        </div>
                        <div class="flex justify-end gap-3 pt-6 mt-6 border-t border-gray-100 dark:border-slate-800">
                            <button type="button" class="close-modal px-6 py-2 border border-gray-300 dark:border-slate-700 rounded-lg hover:bg-gray-50 dark:hover:bg-slate-800" data-t="cancel">取消</button>
                            <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 shadow-lg shadow-blue-500/20" data-t="save">儲存</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div id="payment-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
            <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-100 dark:border-slate-800 flex justify-between items-center bg-green-50 dark:bg-green-900/20">
                    <h3 class="text-xl font-bold text-green-700 dark:text-green-400" data-t="confirmPayment">確認付款資訊</h3>
                    <button class="close-modal p-2 hover:bg-green-100 dark:hover:bg-green-900/30 rounded-full"><i data-lucide="x" class="w-5 h-5 text-green-700"></i></button>
                </div>
                <form id="payment-form" class="p-6">
                    <input type="hidden" id="pay-bill-id">
                    <div class="space-y-4">

        // ==========================================
        // 3. 核心雲端資料同步函數 (Supabase Fetch/Save)
        // ==========================================
        async function loadDataFromCloud() {
            try {
                // 1. 讀取帳單
                const { data: billsData, error: billsErr } = await supabaseClient
                    .from('bills')
                    .select('*')
                    .order('created_at', { ascending: false });
                
                // 2. 讀取範本
                const { data: tplData, error: tplErr } = await supabaseClient
                    .from('templates')
                    .select('*');

                // 3. 讀取類別
                const { data: catData, error: catErr } = await supabaseClient
                    .from('categories')
                    .select('*');

                if (!billsErr && billsData) state.bills = billsData;
                if (!tplErr && tplData) state.templates = tplData;
                if (!catErr && catData && catData.length > 0) {
                    state.categories = catData.map(c => c.name);
                }

                // 同步備份回本地 LocalStorage
                localStorage.setItem('bill_state_backup', JSON.stringify({
                    bills: state.bills,
                    templates: state.templates,
                    categories: state.categories
                }));
            } catch (e) {
                console.warn("無法連接到 Supabase 雲端，切換為本地快取模式:", e);
                const backup = localStorage.getItem('bill_state_backup');
                if (backup) {
                    const parsed = JSON.parse(backup);
                    state.bills = parsed.bills || [];
                    state.templates = parsed.templates || [];
                    state.categories = parsed.categories || ["Utilities", "Rent", "Marketing", "Loans", "Telecom", "Others"];
                }
            }
        }

        async function saveStateToCloud(table, type, recordData) {
            // 先同步更新本地狀態，畫面立即反應
            localStorage.setItem('bill_state_backup', JSON.stringify({
                bills: state.bills,
                templates: state.templates,
                categories: state.categories
            }));

            try {
                if (type === 'insert') {
                    await supabaseClient.from(table).insert([recordData]);
                } else if (type === 'update') {
                    await supabaseClient.from(table).update(recordData).eq('id', recordData.id);
                } else if (type === 'delete') {
                    await supabaseClient.from(table).delete().eq('id', recordData.id);
                }
            } catch (error) {
                console.error(`Supabase 雲端同步失敗 (${table} - ${type}):`, error);
            }
        }

        // 4. UI 切換與語系介面更新

        function updateUI() {

        // ==========================================
        // 5. 儀表板及數據卡片動態渲染
        // ==========================================
        function renderDashboard() {
            const now = new Date();
            let totalUnpaid = 0;
            let due30Count = 0;
            let overdueCount = 0;
            let paidMonthSum = 0;

            const overdueList = document.getElementById('overdue-list');
            const upcomingList = document.getElementById('upcoming-30-list');
            overdueList.innerHTML = '';
            upcomingList.innerHTML = '';

            state.bills.forEach(bill => {
                const dueDate = new Date(bill.dueDate);
                const diffTime = dueDate - now;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                const amt = parseFloat(bill.amount) || 0;

                if (bill.status === 'Unpaid') {
                    if (diffDays < 0) {
                        totalUnpaid += amt;
                        overdueCount++;
                        overdueList.innerHTML += createDashboardRow(bill, 'text-red-600', true);
                    } else {
                        totalUnpaid += amt;
                        if (diffDays <= 30) {
                            due30Count++;
                            upcomingList.innerHTML += createDashboardRow(bill, 'text-yellow-600', false);
                        }
                    }
                } else if (bill.status === 'Paid' && bill.paymentDate) {
                    const pDate = new Date(bill.paymentDate);
                    if (pDate.getMonth() === now.getMonth() && pDate.getFullYear() === now.getFullYear()) {
                        paidMonthSum += amt;
                    }
                }
            });

            if(!overdueList.innerHTML) overdueList.innerHTML = `<div class="p-12 text-center text-gray-400 italic">${i18n[state.lang].noBills}</div>`;
            if(!upcomingList.innerHTML) upcomingList.innerHTML = `<div class="p-12 text-center text-gray-400 italic">${i18n[state.lang].noBills}</div>`;

            document.getElementById('stat-total-unpaid').innerText = `$${totalUnpaid.toLocaleString(undefined, {minimumFractionDigits:2})}`;
            document.getElementById('stat-due-30').innerText = due30Count;
            document.getElementById('stat-overdue').innerText = overdueCount;
            document.getElementById('stat-paid-month').innerText = `$${paidMonthSum.toLocaleString(undefined, {minimumFractionDigits:2})}`;
            lucide.createIcons();
        }

        function createDashboardRow(bill, colorClass, isOverdue) {
            return `
                <div class="p-4 flex items-center justify-between hover:bg-gray-50 dark:hover:bg-slate-800/50 transition-colors">
                    <div>
                        <div class="font-semibold text-sm">${bill.name}</div>
                        <div class="text-xs text-gray-400 mt-0.5">${bill.category} | 到期日: ${bill.dueDate}</div>
                    </div>
                    <div class="text-right">
                        <div class="font-bold text-sm ${colorClass}">$${parseFloat(bill.amount).toFixed(2)}</div>
                        <button onclick="openPaymentModal('${bill.id}')" class="mt-1 text-xs text-blue-600 hover:underline flex items-center gap-1 justify-end">
                            <i data-lucide="check" class="w-3 h-3"></i> 記為已付
                        </button>
                    </div>
                </div>
            `;
        }

        // ==========================================
        // 6. 所有帳單清單及篩選邏輯
        // ==========================================
        function renderBillsTable() {
            const tbody = document.getElementById('bills-table-body');
            tbody.innerHTML = '';

            const yFilter = document.getElementById('filter-year').value;
            const mFilter = document.getElementById('filter-month').value;
            const cFilter = document.getElementById('filter-category').value;
            const sFilter = document.getElementById('filter-status').value;
            const search = document.getElementById('search-bills').value.toLowerCase();

            let filtered = state.bills.filter(bill => {
                const d = new Date(bill.dueDate);
                if (yFilter !== 'all' && d.getFullYear().toString() !== yFilter) return false;
                if (mFilter !== 'all' && (d.getMonth() + 1).toString() !== mFilter) return false;
                if (cFilter !== 'all' && bill.category !== cFilter) return false;
                
                if (sFilter !== 'all') {
                    if (sFilter === 'Overdue') {
                        return bill.status === 'Unpaid' && new Date(bill.dueDate) < new Date();
                    }
                    if (bill.status !== sFilter) return false;
                }
                
                if (search && !bill.name.toLowerCase().includes(search) && !bill.remark?.toLowerCase().includes(search)) return false;
                return true;
            });

            // 排序邏輯
            filtered.sort((a, b) => {
                let vA = a[state.sortField];
                let vB = b[state.sortField];
                if(state.sortField === 'amount') {
                    vA = parseFloat(vA) || 0;
                    vB = parseFloat(vB) || 0;
                }
                if (vA < vB) return state.sortOrder === 'asc' ? -1 : 1;
                if (vA > vB) return state.sortOrder === 'asc' ? 1 : -1;
                return 0;
            });

            filtered.forEach(bill => {
                const isOverdue = bill.status === 'Unpaid' && new Date(bill.dueDate) < new Date();
                let badge = `<span class="px-2 py-1 rounded-full text-xs font-semibold bg-gray-100 text-gray-700 dark:bg-slate-800 dark:text-slate-300">未知</span>`;
                if (bill.status === 'Paid') badge = `<span class="px-2 py-1 rounded-full text-xs font-semibold bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400">已付</span>`;
                else if (isOverdue) badge = `<span class="px-2 py-1 rounded-full text-xs font-semibold bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400">逾期</span>`;
                else if (bill.status === 'Unpaid') badge = `<span class="px-2 py-1 rounded-full text-xs font-semibold bg-yellow-100 text-yellow-700 dark:bg-yellow-900/30 dark:text-yellow-400">未付</span>`;

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50/50 dark:hover:bg-slate-800/30 transition-colors">
                        <td class="px-6 py-4">
                            <div class="font-medium">${bill.name}</div>

        // ==========================================
        // 8. 歷史紀錄分月份渲染
        // ==========================================
        function renderHistory() {
            const container = document.getElementById('history-content');
            container.innerHTML = '';

            const paidBills = state.bills.filter(b => b.status === 'Paid' && b.paymentDate);
            const search = document.getElementById('search-history').value.toLowerCase();

            // 按付款時間分群組
            const groups = {};
            paidBills.forEach(b => {
                if (search && !b.name.toLowerCase().includes(search) && !b.remark?.toLowerCase().includes(search)) return;
                const pDate = new Date(b.paymentDate);
                const key = `${pDate.getFullYear()}-${String(pDate.getMonth() + 1).padStart(2, '0')}`;
                if (!groups[key]) groups[key] = [];
                groups[key].push(b);
            });

            const sortedKeys = Object.keys(groups).sort().reverse();
            if(sortedKeys.length === 0) {
                container.innerHTML = `<div class="p-12 text-center text-gray-400 italic">${i18n[state.lang].noBills}</div>`;
                return;
            }

            sortedKeys.forEach(key => {
                const bills = groups[key];
                const sum = bills.reduce((acc, b) => acc + (parseFloat(b.amount) || 0), 0);
                
                let html = `
                    <div class="border border-gray-100 dark:border-slate-800 rounded-xl overflow-hidden bg-gray-50/30 dark:bg-slate-800/20">
                        <div class="bg-gray-50 dark:bg-slate-800 px-4 py-3 flex justify-between items-center border-b border-gray-100 dark:border-slate-700">
                            <span class="font-bold text-sm">${key}</span>
                            <span class="text-sm font-bold text-green-600">已付總計: $${sum.toFixed(2)}</span>
                        </div>
                        <div class="divide-y divide-gray-100 dark:divide-slate-800 bg-white dark:bg-slate-900">
                `;

                bills.forEach(b => {
                    html += `
                        <div class="p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-sm">
                            <div>
                                <div class="font-semibold text-gray-900 dark:text-white">${b.name}</div>
                                <div class="text-xs text-gray-400 mt-1">
                                    類別: ${b.category} | 付款日: ${b.paymentDate} | 方式: ${b.paymentMethod || '轉帳'}
                                    ${b.chequeNo ? ` | 支票號碼: ${b.chequeNo}` : ''}
                                    ${b.bankRef ? ` | 銀行流水: ${b.bankRef}` : ''}
                                </div>
                            </div>
                            <div class="text-right font-bold text-green-600 sm:min-w-[100px]">$${parseFloat(b.amount).toFixed(2)}</div>
                        </div>
                    `;
                });

                html += `</div></div>`;
                container.innerHTML += html;
            });
        }

        // ==========================================
        document.getElementById('apply-smart-paste').addEventListener('click', () => {
            const text = document.getElementById('smart-paste-input').value;
            if(!text) return;

            // 1. 金額提取邏輯 (支援 $500, 500元, HKD500 等格式)
            const amtMatch = text.match(/(?:\$|HKD|RMB|￥|金額|💰)?\s*([0-9:.,]+)/i);
            if (amtMatch) {
                let amtStr = amtMatch[1].replace(/,/g, '');
                if (!isNaN(parseFloat(amtStr))) {
                    document.getElementById('bill-amount').value = parseFloat(amtStr);
                }
            }

            // 2. 日期提取邏輯 (支援 2024-06-30, 2024/06/30, 30/6, 6月30日 等)
            const dateMatch = text.match(/(\d{4}[-/.]\d{1,2}[-/.]\d{1,2})|(\d{1,2}[-/.]\d{1,2})/);
            if (dateMatch) {
                if (dateMatch[1]) {
                    document.getElementById('bill-due-date').value = dateMatch[1].replace(/\//g, '-');
                } else if (dateMatch[2]) {
                    const currentYear = new Date().getFullYear();
                    const parts = dateMatch[2].split(/[-/.]/);
                    document.getElementById('bill-due-date').value = `${currentYear}-${parts[0].padStart(2, '0')}-${parts[1].padStart(2, '0')}`;
                }
            }

            // 3. 抬頭名稱模糊識別
            const lines = text.split(/[\n,，]/);
            if (lines.length > 0 && lines[0].length < 30) {
                document.getElementById('bill-name').value = lines[0].trim();
            }
        });

            let targetBills = state.bills.filter(bill => {

                if (yFilter !== 'all' && d.getFullYear().toString() !== yFilter) return false;
                if (mFilter !== 'all' && (d.getMonth() + 1).toString() !== mFilter) return false;
                if (cFilter !== 'all' && bill.category !== cFilter) return false;

        function downloadCSV(billsList) {
            let csv = '\uFEFF帳單名稱,類別,金額,金額類型,到期日,狀態,付款人,支付週期,支票抬頭,付款帳號,付款日期,付款方式,備註\n';

            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", `帳單匯出報告_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

        // 排序按鈕觸發事件
        document.getElementById('sort-amount').addEventListener('click', () => {
            state.sortOrder = (state.sortField === 'amount' && state.sortOrder === 'asc') ? 'desc' : 'asc';
            state.sortField = 'amount';
            renderBillsTable();
        });
        document.getElementById('sort-date').addEventListener('click', () => {
            state.sortOrder = (state.sortField === 'date' && state.sortOrder === 'asc') ? 'desc' : 'asc';
            state.sortField = 'date';
            renderBillsTable();
        });
        document.getElementById('sort-status').addEventListener('click', () => {
            state.sortOrder = (state.sortField === 'status' && state.sortOrder === 'asc') ? 'desc' : 'asc';
            state.sortField = 'status';
            renderBillsTable();
        });

        // 語系與暗黑模式切換監聽
        document.getElementById('toggle-lang').addEventListener('click', () => {
            state.lang = state.lang === 'zh' ? 'en' : 'zh';
            updateUI();
            renderAll();
        });
        document.getElementById('toggle-dark').addEventListener('click', () => {
            state.dark = !state.dark;
            updateUI();
        });

        // 即時輸入篩選觸發
        ['filter-year', 'filter-month', 'filter-category', 'filter-status', 'search-bills'].forEach(id => {
            document.getElementById(id).addEventListener('change', renderBillsTable);
            if(id === 'search-bills') document.getElementById(id).addEventListener('input', renderBillsTable);
        });
        document.getElementById('search-history').addEventListener('input', renderHistory);

        // 網頁開啟載入流程
        window.onload = async () => {
            updateUI();
            // 先從本地快取或雲端非同步載入最新資料
            await loadDataFromCloud();
            renderAll();
        };
    </script>
</body>
</html>
